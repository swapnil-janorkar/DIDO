services:

  postgres:
    image: postgres:17
    container_name: dido-postgres

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dido

    ports:
      - "5432:5432"

    volumes:
      - dido-postgres-data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql

  backend:
    build:
      context: ./backend

    container_name: dido-api

    ports:
      - "5000:5000"

    env_file:
      - ./backend/.env

    depends_on:
      - postgres

    volumes:
      - ./backend/src:/app/src          # hot-reload: host src → container
      - /app/node_modules               # keep container's node_modules intact

  frontend:
    build:
      context: ./frontend

    container_name: dido-frontend

    ports:
      - "3000:3000"

    depends_on:
      - backend

    volumes:
      - ./frontend/src:/app/src         # hot-reload: host src → container
      - ./frontend/app:/app/app         # Next.js App Router pages
      - /app/node_modules               # keep container's node_modules intact
      - /app/.next                      # keep Next.js build cache in container

volumes:
  dido-postgres-data: